name: Release (Go)

on:
  push:
    tags:
      - "v*"
      - "*/v*"
      - "*/*/v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  MISE_ENV: ci

jobs:
  release:
    name: Tag-driven library release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit
          disable-telemetry: "true"
          disable-sudo: "true"
      - name: Obtain release token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: Pinguteca/sdk-core-go
          identity: release
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.octo-sts.outputs.token }}
      - name: Install mise and tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
      - name: Parse package scope from tag
        id: scope
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Tag shapes:
          #   vX.Y.Z                            -> root module, package dir is "."
          #   <dir>/vX.Y.Z                      -> companion at top level
          #   <dir1>/<dir2>/.../vX.Y.Z          -> nested companion
          # The slug replaces "/" with "-" so artifact filenames are
          # filesystem-safe even when the tag has multiple segments.
          version="${TAG##*/}"
          if [ "${version}" = "${TAG}" ]; then
            package_dir="."
            slug="${TAG}"
          else
            package_dir="${TAG%/*}"
            slug="${TAG//\//-}"
          fi
          {
            echo "tag=${TAG}"
            echo "version=${version}"
            echo "package_dir=${package_dir}"
            echo "slug=${slug}"
          } >> "$GITHUB_OUTPUT"
      - name: Build source archive
        env:
          TAG: ${{ github.ref_name }}
          SLUG: ${{ steps.scope.outputs.slug }}
        run: |
          mkdir -p out
          git archive --format=tar.gz --prefix="${SLUG}/" -o "out/sdk-core-go-${SLUG}.tar.gz" "${TAG}"
      - name: Generate SBOM
        env:
          PACKAGE_DIR: ${{ steps.scope.outputs.package_dir }}
          SLUG: ${{ steps.scope.outputs.slug }}
        run: mise run release-sbom
      - name: Compute checksums
        env:
          SLUG: ${{ steps.scope.outputs.slug }}
        run: |
          cd out
          sha256sum "sdk-core-go-${SLUG}.tar.gz" "sbom/sdk-core-go-${SLUG}.cdx.json" > checksums.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums
        run: |
          cd out
          cosign sign-blob \
            --bundle=checksums.txt.sigstore.json \
            --yes \
            checksums.txt
      - name: Compute SLSA subject hashes
        id: hash
        run: |
          echo "hashes=$(base64 -w0 out/checksums.txt)" >> "$GITHUB_OUTPUT"
      # GitHub releases on org-immutable repos cannot have assets
      # deleted, so softprops's delete-and-replace flow fails on
      # every retry. Atomic gh release create on first run, no-op
      # on retry.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          TAG: ${{ github.ref_name }}
          SLUG: ${{ steps.scope.outputs.slug }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping create."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            "out/sdk-core-go-${SLUG}.tar.gz" \
            "out/sbom/sdk-core-go-${SLUG}.cdx.json" \
            out/checksums.txt \
            out/checksums.txt.sigstore.json

  provenance:
    name: SLSA provenance
    needs: release
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      # Keep provenance as a workflow artifact only. Attaching to the
      # GitHub Release races whichever tool owns the release lifecycle
      # (softprops today, possibly GoReleaser/JReleaser later) and SLSA
      # verifiers pull provenance from the workflow run, not the release.
      upload-assets: false
      provenance-name: provenance.intoto.jsonl
      private-repository: false
