name: Verify GHA Integrity

on:
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths: [".github/workflows/**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify pinned action SHAs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC token for octo-sts to fetch a scoped repo token
      contents: write # commit the regenerated lockfile back to the branch
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-telemetry: "true"
          disable-sudo-and-containers: "true"
      - name: Obtain token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: Pinguteca/sdk-core-go
          identity: verify-gha-integrity
      - name: Optimize Git config for CI
        run: |
          git config --global core.compression 0
          git config --global core.fsync -all
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the branch itself, not the PR merge commit, so a
          # regenerated lockfile can be pushed back to it.
          ref: ${{ github.head_ref || github.ref_name }}
          # Keep the token out of .git/config; only the push step gets it.
          persist-credentials: false
          token: ${{ steps.octo-sts.outputs.token }}
      # Advisories are checked separately below, so only a real lockfile
      # mismatch fails this step and leads to a regeneration.
      - name: Verify lockfile
        id: verify
        uses: gjtorikian/gh-actions-lockfile@8abbeb1fe0a4bf20279c81fa206e6a2fc862a830 # v1.2.1
        with:
          mode: verify
          skip-advisories: "true"
          comment: "false"
      # Fix drift only on pull requests: main takes changes through pull requests,
      # so a push there just fails and asks for a lockfile PR.
      - name: Regenerate lockfile on failure
        if: failure() && steps.verify.outcome == 'failure' && github.event_name == 'pull_request'
        uses: gjtorikian/gh-actions-lockfile@8abbeb1fe0a4bf20279c81fa206e6a2fc862a830 # v1.2.1
        with:
          mode: generate
      - name: Commit regenerated lockfile
        if: failure() && steps.verify.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          TOKEN: ${{ steps.octo-sts.outputs.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git add -- .github/actions.lock.json
          git diff --cached --quiet && exit 0
          # Never commit twice in a row: if the last commit already regenerated
          # the lockfile and it still drifts, stop instead of looping.
          if [ "$(git log -1 --format=%s)" = "ci: regenerate .github/actions.lock.json" ]; then
            echo "::error::lockfile still drifts after a regeneration commit"
            exit 1
          fi
          # Renovate ignores commits from this exact address (gitIgnoredAuthors)
          # and keeps managing its branch after the lockfile commit. No [skip ci]:
          # the head commit must run the required checks.
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "ci: regenerate .github/actions.lock.json"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${BRANCH}"
      # Advisories never trigger a regeneration, and they warn instead of
      # failing: the tool's version matching flags releases that already ship
      # the fix.
      - name: Check action advisories
        if: always()
        continue-on-error: true
        uses: gjtorikian/gh-actions-lockfile@8abbeb1fe0a4bf20279c81fa206e6a2fc862a830 # v1.2.1
        with:
          mode: verify
          skip-sha: "true"
          skip-integrity: "true"
          comment: "false"
