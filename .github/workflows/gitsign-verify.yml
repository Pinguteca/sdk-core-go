name: Verify Commit Signatures

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Sigstore commit signatures
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
          disable-telemetry: "true"
          disable-sudo-and-containers: "true"
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitsign
        uses: chainguard-dev/actions/setup-gitsign@fed81b5f62f7e11d0c33331f4dd488f6aaff71cc # main
      - name: Verify every commit in PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Merge commits are created by GitHub (or `git merge` runs)
          # without a gitsign signature, so include only the actual
          # content commits the PR introduces.
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            echo "Verifying $sha"
            gitsign verify "$sha" \
              --certificate-identity-regexp="^.*@(pinguteca\.com|gmail\.com)$" \
              --certificate-oidc-issuer="https://github.com/login/oauth"
          done
