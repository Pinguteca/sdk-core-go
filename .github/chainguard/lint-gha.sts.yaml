issuer: https://token.actions.githubusercontent.com
# Pushes to main and pull_request runs from branches in this repo. Fork PRs
# never get an OIDC token, so they cannot reach this policy.
subject_pattern: "^repo:Pinguteca/sdk-core-go:(pull_request|ref:refs/heads/main)$"
claim_pattern:
  workflow_ref: "Pinguteca/sdk-core-go/\\.github/workflows/lint-gha\\.yml@refs/(heads/main|pull/[0-9]+/merge)"
permissions:
  # The token only checks out the workflows. The SARIF upload uses the job's
  # own security-events permission, not this token.
  contents: read
