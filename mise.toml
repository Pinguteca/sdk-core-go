[settings]
experimental = true
env_cache = true
env_cache_ttl = "9h"
install_before = "7d"
pin = true
lockfile = true
locked = false
prefer_offline = true
disable_default_registry = true
disable_backends = ["asdf", "vfox", "ubi"]

[tools]
"github:mongodb/kingfisher" = "2.5.0"
cocogitto = "7.0.0"
pinact = "5.0.0"
prek = "0.4.14"
syft = "1.51.0"
go = "1.26.6"
golangci-lint = "2.12.2"

[tasks."secret:scan"]
run = "kingfisher scan . --no-validate --redact"
description = "Scan codebase for secrets with Kingfisher"
alias = "ss"

[tasks."secret:validate"]
run = "kingfisher scan . --redact"
description = "Validate (and revoke) live secrets found by Kingfisher"
alias = "sv"

[tasks.bump]
run = "cog bump --auto"
description = "Calculate next version from conventional commits and tag"

[tasks."release:sbom"]
run = [
  "mkdir -p out/sbom",
  "syft scan dir:${PACKAGE_DIR:-.} -o cyclonedx-json=out/sbom/sdk-core-go-${SLUG:-root}.cdx.json",
]
description = "Generate CycloneDX SBOM for one module (env: PACKAGE_DIR, SLUG)"
alias = "rsbom"

[tasks.lint]
description = "Run all linting"
depends = ["lint:*"]

[tasks.build]
run = "go run ./tools/workspace-run -- build ./..."
description = "Build every Go package in every workspace module"
alias = "b"

[tasks.test]
# A bare `go test ./...` only covers the root module; workspace-run
# reads go.work and covers all of them. The race detector lives in
# test:race because -race needs cgo, which not every dev box has.
run = "go run ./tools/workspace-run -- test ./..."
description = "Run all Go tests across every workspace module"
alias = "t"

[tasks."test:race"]
run = "go run ./tools/workspace-run -- test -race -count=1 ./..."
description = "Run all Go tests with the race detector (requires cgo)"
alias = "tr"

[tasks."lint:go"]
run = "go run ./tools/workspace-run -cmd golangci-lint -- run ./... --fix"
description = "Lint Go code with autofix across every workspace module"
sources = ["**/*.go"]

[tasks."lint:l2-deps"]
run = "go run ./tools/check-l2-deps"
description = "Verify root go.mod direct deps match the Layer 2 allow list (RFC 0002, RFC 0003, ADR 0011)"
sources = ["go.mod", "tools/check-l2-deps/**/*"]
