[settings]
experimental = true
env_cache = true
env_cache_ttl = "9h"
install_before = "7d"
pin = true
lockfile = true
locked = false
prefer_offline = true
disable_default_registry = true
disable_backends = ["asdf", "vfox", "ubi"]

[tools]
"github:mongodb/kingfisher" = "1.102.0"
cocogitto = "7.0.0"
pinact = "4.0.0"
prek = "0.4.4"
syft = "1.45.0"
go = "1.26.4"
golangci-lint = "2.12.2"

[tasks."secret:scan"]
run = "kingfisher scan . --no-validate --redact"
description = "Scan codebase for secrets with Kingfisher"
alias = "ss"

[tasks."secret:validate"]
run = "kingfisher scan . --redact"
description = "Validate (and revoke) live secrets found by Kingfisher"
alias = "sv"

[tasks.bump]
run = "cog bump --auto"
description = "Calculate next version from conventional commits and tag"

# release:sbom lives as a file task at .mise-tasks/release-sbom.ps1 so the
# filesystem and env-defaulting logic stays OS-agnostic via PowerShell Core.

[tasks.lint]
description = "Run all linting"
depends = ["lint:*"]

[tasks.build]
run = "go build ./..."
description = "Build all Go packages"
alias = "b"

[tasks.test]
run = "go test ./..."
description = "Run all Go tests"
alias = "t"

[tasks."lint:go"]
run = "golangci-lint run ./... --fix"
description = "Lint Go code with autofix"
sources = ["**/*.go"]

[tasks."lint:l2-deps"]
run = "go run ./tools/check-l2-deps"
description = "Verify root go.mod direct deps match the Layer 2 allow list (RFC 0002, RFC 0003, ADR 0011)"
sources = ["go.mod", "tools/check-l2-deps/**/*"]
