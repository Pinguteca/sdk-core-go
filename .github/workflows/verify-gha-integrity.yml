name: Verify GHA Integrity

on:
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths: [".github/workflows/**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify pinned action SHAs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC token for octo-sts so checkout can read the repo
      contents: write # auto-commit regenerated actions.lock.json on drift
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: "true"
          disable-sudo-and-containers: "true"
      - name: Obtain token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: Pinguteca/sdk-core-go
          identity: verify-gha-integrity
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Persist the octo-sts token (not GITHUB_TOKEN) so the
          # auto-commit step can push the regenerated lockfile.
          # The trust policy in .github/chainguard scopes the grant
          # to this workflow and the token expires in an hour.
          persist-credentials: true
          token: ${{ steps.octo-sts.outputs.token }}
      - name: Verify lockfile
        uses: gjtorikian/gh-actions-lockfile@8abbeb1fe0a4bf20279c81fa206e6a2fc862a830 # v1.2.1
        with:
          mode: verify
      - name: Regenerate lockfile on failure
        if: failure()
        uses: gjtorikian/gh-actions-lockfile@8abbeb1fe0a4bf20279c81fa206e6a2fc862a830 # v1.2.1
        with:
          mode: generate
      - name: Auto-commit regenerated lockfile
        if: failure()
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "ci: regenerate .github/actions.lock.json [skip ci]"
          file_pattern: .github/actions.lock.json
