name: Optimize SVGs

on:
  push:
    branches: [main]
    paths: ["**.svg"]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ["**.svg"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect SVG changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.filter.outputs.svg }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Filter SVGs
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            svg:
              - "**/*.svg"

  optimize:
    name: Run SVGO
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC token for octo-sts to fetch a scoped repo token
      contents: write # commit optimized SVG assets back to the branch
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          disable-telemetry: "true"
          disable-sudo-and-containers: "true"
      - name: Obtain token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: Pinguteca/sdk-core-go
          identity: svg-optimization
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.octo-sts.outputs.token }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
      - name: Run SVGO
        run: |
          npm config set -g minimumReleaseAge 30240
          npx --yes svgo@4 --multipass --recursive .
      - name: Install gitsign
        uses: chainguard-dev/actions/setup-gitsign@fed81b5f62f7e11d0c33331f4dd488f6aaff71cc # main
      - name: Auto-commit optimized SVGs
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: optimize svgs"
          file_pattern: "**/*.svg"
          commit_user_name: "Pinguteca Bot"
          commit_user_email: "bot@pinguteca.com"
