issuer: https://token.actions.githubusercontent.com
# Pushes to main and pull_request runs from branches in this repo. Fork PRs
# never get an OIDC token, so they cannot reach this policy.
subject_pattern: "^repo:Pinguteca/sdk-core-go:(pull_request|ref:refs/heads/main)$"
claim_pattern:
  workflow_ref: "Pinguteca/sdk-core-go/\\.github/workflows/svg-optimization\\.yml@refs/(heads/main|pull/[0-9]+/merge)"
permissions:
  # id-token: write comes from the svg-optimization job permissions
  # block in the workflow; octo-sts schema rejects hyphenated keys
  # here.
  contents: write
