name: Build (Go)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
# No workflow-level paths filter: when the build is a required check, a pull
# request that never starts the workflow waits on it forever. The changes job
# skips the build instead, and GitHub counts a skipped job as passing.

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  MISE_ENV: ci

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout
      pull-requests: read # list the pull request's changed files
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-telemetry: "true"
          disable-sudo-and-containers: "true"
      - name: Optimize Git config for CI
        run: |
          git config --global core.compression 0
          git config --global core.fsync -all
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Filter build inputs
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            build:
              - "**/*.go"
              - "**/go.mod"
              - "**/go.sum"
              - "go.work"
              - "go.work.sum"
              - ".golangci.yaml"
              - "mise.toml"
              - "mise.ci.toml"
              - "mise.lock"
              - ".github/workflows/build-go.yml"

  build:
    name: Build, lint and test
    needs: changes
    # Always build main; build a pull request only when its build inputs changed.
    if: github.event_name == 'push' || needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      id-token: write # OIDC token for octo-sts to fetch a scoped repo token
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-telemetry: "true"
          disable-sudo-and-containers: "true"
      - name: Optimize Git config for CI
        run: |
          git config --global core.compression 0
          git config --global core.fsync -all
      - name: Obtain token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: Pinguteca/sdk-core-go
          identity: build
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: "blob:none"
          token: ${{ steps.octo-sts.outputs.token }}
      - name: Install mise and tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          experimental: true
          install: true
          # Never restore a CI cache: a poisoned entry would feed builds and
          # releases.
          cache: false
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
      - name: Lint
        run: mise run ci:lint
      - name: Test
        run: mise run ci:test
      - name: Build
        run: mise run ci:build
      # The go directive promises consumers that this Go is enough, so build
      # and test on it too. go.work carries the highest module floor. A
      # two-part floor such as 1.27 means 1.27.0; passed as is, mise would
      # pick the newest 1.27 patch instead.
      - name: Read the floor Go
        id: floor
        run: |
          version=$(go work edit -json | jq -r .Go)
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then version="${version}.0"; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Test on the floor Go
        env:
          MISE_GO_VERSION: ${{ steps.floor.outputs.version }}
        run: |
          mise run ci:build
          mise run ci:test
