[settings]
experimental = true
env_cache = true
env_cache_ttl = "9h"
install_before = "7d"
pin = true
lockfile = true
locked = false
prefer_offline = true
disable_default_registry = true
disable_backends = ["asdf", "vfox", "ubi"]

[tasks."ci:git-config"]
run = """
git config --global core.compression 0
git config --global core.fsync -all
"""
description = "Optimize Git config for CI (disable compression, fsync)"

[tasks."ci:build"]
run = "go run ./tools/workspace-run -- build ./..."
description = "Compile every Go package in every workspace module"

[tasks."ci:test"]
# `go test ./...` resolves the pattern against the current module only,
# so running it at the root silently skipped the nine companion modules.
# workspace-run reads go.work and covers all of them.
run = "go run ./tools/workspace-run -- test -race -count=1 ./..."
description = "Run Go tests with the race detector across every workspace module"

[tasks."ci:lint"]
# golangci-lint resolves ./... against the current module too, so a root
# invocation left the nine companion modules unlinted.
run = "go run ./tools/workspace-run -cmd golangci-lint -- run ./... --timeout=5m"
description = "Lint Go code in every workspace module"
