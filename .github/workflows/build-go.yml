name: Build (Go)

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - "go.work"
      - "go.work.sum"
      - ".golangci.yaml"
      - "mise.toml"
      - "mise.ci.toml"
      - "mise.lock"
      - ".github/workflows/build-go.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - "go.work"
      - "go.work.sum"
      - ".golangci.yaml"
      - "mise.toml"
      - "mise.ci.toml"
      - "mise.lock"
      - ".github/workflows/build-go.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  MISE_ENV: ci

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      id-token: write # OIDC token for octo-sts to fetch a scoped repo token
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: "true"
          disable-sudo-and-containers: "true"
      - name: Optimize Git config for CI
        run: |
          git config --global core.compression 0
          git config --global core.fsync -all
      - name: Obtain token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: Pinguteca/sdk-core-go
          identity: build
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: "blob:none"
          token: ${{ steps.octo-sts.outputs.token }}
      - name: Install mise and tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          experimental: true
          install: true
          # Never restore a CI cache: a poisoned entry would feed builds and
          # releases.
          cache: false
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
      - name: Lint
        run: mise run ci:lint
      - name: Test
        run: mise run ci:test
      - name: Build
        run: mise run ci:build
      # The go directive promises consumers that this Go is enough, so build
      # and test on it too. go.work carries the highest module floor. A
      # two-part floor such as 1.27 means 1.27.0; passed as is, mise would
      # pick the newest 1.27 patch instead.
      - name: Read the floor Go
        id: floor
        run: |
          version=$(go work edit -json | jq -r .Go)
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then version="${version}.0"; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Test on the floor Go
        env:
          MISE_GO_VERSION: ${{ steps.floor.outputs.version }}
        run: |
          mise run ci:build
          mise run ci:test
