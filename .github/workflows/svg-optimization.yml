name: Optimize SVGs

on:
  push:
    branches: [main]
    paths: ["**.svg"]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ["**.svg"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect SVG changes
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    outputs:
      changed: ${{ steps.filter.outputs.svg }}
    steps:
      - name: Optimize Git config for CI
        run: |
          git config --global core.compression 0
          git config --global core.fsync -all
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Filter SVGs
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            svg:
              - "**/*.svg"

  optimize:
    name: Run SVGO
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC token for octo-sts to fetch a scoped repo token
      contents: write # commit optimized SVGs back to the branch
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: "true"
          disable-sudo-and-containers: "true"
      - name: Obtain token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: Pinguteca/sdk-core-go
          identity: svg-optimization
      - name: Optimize Git config for CI
        run: |
          git config --global core.compression 0
          git config --global core.fsync -all
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the branch itself, not the PR merge commit, so the
          # optimized SVGs can be pushed back to it.
          ref: ${{ github.head_ref || github.ref_name }}
          # SVGO is third-party code; keep the token out of .git/config and
          # hand it only to the push below.
          persist-credentials: false
          token: ${{ steps.octo-sts.outputs.token }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Run SVGO
        run: |
          npm config set -g minimumReleaseAge 30240
          npx --yes svgo@4 --multipass --recursive .
      - name: Install gitsign
        uses: chainguard-dev/actions/setup-gitsign@84b1be4c638f12d4256ddddef17af98853b6d0d9 # v1.6.40
      - name: Commit optimized SVGs
        env:
          TOKEN: ${{ steps.octo-sts.outputs.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git add -- '*.svg'
          git diff --cached --quiet && exit 0
          git -c user.name="Pinguteca Bot" -c user.email="bot@pinguteca.com" \
            commit -m "chore: optimize svgs"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${BRANCH}"
