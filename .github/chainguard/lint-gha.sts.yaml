issuer: https://token.actions.githubusercontent.com
# Allow both main pushes and PR refs so action-lint runs on
# pull_request events too.
subject_pattern: "^repo:Pinguteca/sdk-core-go:(pull_request|ref:refs/heads/main)$"
claim_pattern:
  workflow_ref: "Pinguteca/sdk-core-go/\\.github/workflows/lint-gha\\.yml@.*"
permissions:
  # octo-sts only issues GitHub repo tokens, so the SARIF upload's
  # security-events: write comes from the lint-gha job permissions
  # block in the workflow itself. This token only needs to read
  # the workflow files actionlint inspects.
  contents: read
