name: Sync go.work.sum

# Renovate updates each module's go.mod and go.sum but not the workspace's
# go.work.sum, which the hk pre-push check then rejects. Regenerate it on the
# pull request the same way that check does and commit it back.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "**/go.mod"
      - "**/go.sum"
      - "go.work"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  MISE_ENV: ci

jobs:
  sync:
    name: Sync go.work.sum
    # Fork pull requests get no OIDC token, so they cannot obtain a token to push.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC token for octo-sts to fetch a scoped repo token
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          disable-telemetry: "true"
          disable-sudo-and-containers: "true"
      - name: Optimize Git config for CI
        run: |
          git config --global core.compression 0
          git config --global core.fsync -all
      - name: Obtain token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: Pinguteca/sdk-core-go
          identity: sync-go-work-sum
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the branch itself, not the PR merge commit, so the
          # regenerated file can be pushed back to it.
          ref: ${{ github.head_ref }}
          # Keep the token out of .git/config; only the push step gets it.
          persist-credentials: false
          filter: "blob:none"
          token: ${{ steps.octo-sts.outputs.token }}
      - name: Install mise and tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          experimental: true
          install: true
          # Never restore a CI cache: a poisoned entry would feed builds and
          # releases.
          cache: false
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
      - name: Resolve the workspace closure
        run: go mod download
      - name: Commit go.work.sum
        env:
          TOKEN: ${{ steps.octo-sts.outputs.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          git add -- go.work go.work.sum
          git diff --cached --quiet && exit 0
          # Renovate ignores commits from this exact address (gitIgnoredAuthors)
          # and keeps managing its branch. No [skip ci]: the push uses the Octo
          # STS token, so checks run on the new head, where this job finds
          # nothing left to commit.
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "build(deps): sync go.work.sum"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${BRANCH}"
